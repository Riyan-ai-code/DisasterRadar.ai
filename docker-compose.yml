version: "3.9"

services:
  disasterradar-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disasterradar-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
    volumes:
      - ./models:/app/models
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: disasterradar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - disasterradar-backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: disasterradar-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=disasterradar
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
