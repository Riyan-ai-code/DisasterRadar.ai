global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "disasterradar-mlops-monitor"

scrape_configs:
  - job_name: "disasterradar-fastapi-mlops"
    metrics_path: "/api/metrics/prometheus"
    static_configs:
      - targets: ["disasterradar-backend:8000", "host.docker.internal:8000"]
        labels:
          service: "flood-cyclone-ml-engine"
          environment: "production"
